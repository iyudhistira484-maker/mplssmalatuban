<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Admin — SMAN 5 Tuban MPLS</title>
<link rel="icon" href="logo.png" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="fx.css" />
<link rel="stylesheet" href="polish.css" />
<link rel="stylesheet" href="polish-v2.css" />
<link rel="stylesheet" href="nusantara-global.css" />
<link rel="stylesheet" href="fixes-v3.css" />
<link rel="stylesheet" href="mobile-fix.css" />
<link rel="stylesheet" href="desktop-fix.css" />
<link rel="stylesheet" href="fixes-v6.css" />
</head>
<body>
<div class="nu-garuda-bg" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar admin" id="sb">
    <div class="sb-head">
      <img src="logo.png" alt="SMAN 5 Tuban" class="brand-logo" width="40" height="40" style="object-fit:contain;display:block" />
      <div class="brand-text"><strong>SMAN 5 TUBAN</strong><span>ADMIN PANEL</span></div>
    </div>
    <div class="sb-body">
      <div class="sb-section">DASHBOARD</div>
      <nav class="sb-nav">
        <a class="sb-link active" data-page="overview"><i class="fa-solid fa-gauge-high"></i> Ringkasan</a>
      </nav>
      <div class="sb-section">KELOLA KONTEN</div>
      <nav class="sb-nav">
        <a class="sb-link" data-page="soal"><i class="fa-solid fa-file-pen"></i> Soal</a>
        <a class="sb-link" data-page="materi"><i class="fa-solid fa-book-open"></i> Materi</a>
        <a class="sb-link" data-page="jadwal"><i class="fa-solid fa-calendar-days"></i> Jadwal</a>
        <a class="sb-link" data-page="kegiatan"><i class="fa-solid fa-flag-checkered"></i> Kegiatan</a>
      </nav>
      <div class="sb-section">DATA SISWA</div>
      <nav class="sb-nav">
        <a class="sb-link" data-page="jawaban"><i class="fa-solid fa-clipboard-check"></i> Jawaban Siswa</a>
        <a class="sb-link" data-page="absensi"><i class="fa-solid fa-location-dot"></i> Absensi & Analitik</a>
        <a class="sb-link" data-page="audit"><i class="fa-solid fa-shield-halved"></i> Audit Log</a>
        <a class="sb-link" data-page="rating"><i class="fa-solid fa-star"></i> Rating OSIS</a>
        <a class="sb-link" data-page="export"><i class="fa-solid fa-file-csv"></i> Export Nilai (CSV)</a>
      </nav>
    </div>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="av" id="avInit">A</div>
        <div><strong id="uName">Admin</strong><span>Administrator</span></div>
      </div>
      <button class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:10px;color:#cfd8eb"><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Ringkasan</h1>
      <div class="top-actions">
        <span class="badge gold"><i class="fa-solid fa-user-shield"></i> Admin</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Mobile Bottom Navigation (Admin) -->
<nav class="mobile-bottom-nav" id="mobileBottomNav">
  <button class="mbn-item active" data-page="overview"><i class="fa-solid fa-gauge-high"></i><span>Ringkasan</span></button>
  <button class="mbn-item" data-page="soal"><i class="fa-solid fa-file-pen"></i><span>Soal</span></button>
  <button class="mbn-item" data-page="materi"><i class="fa-solid fa-book-open"></i><span>Materi</span></button>
  <button class="mbn-item" data-page="jawaban"><i class="fa-solid fa-clipboard-check"></i><span>Jawaban</span></button>
  <button class="mbn-item" id="mbnMore"><i class="fa-solid fa-grid-2"></i><span>Lainnya</span></button>
</nav>

<!-- More Sheet (Admin) -->
<div class="mbn-backdrop" id="mbnBackdrop"></div>
<div class="mbn-sheet" id="mbnSheet">
  <div class="mbn-sheet-handle"></div>
  <div class="mbn-sheet-title">Menu Lainnya</div>
  <div class="mbn-sheet-grid">
    <button class="mbn-sheet-item" data-page="jadwal"><i class="fa-solid fa-calendar-days"></i><span>Jadwal</span></button>
    <button class="mbn-sheet-item" data-page="kegiatan"><i class="fa-solid fa-flag-checkered"></i><span>Kegiatan</span></button>
    <button class="mbn-sheet-item" data-page="absensi"><i class="fa-solid fa-location-dot"></i><span>Absensi</span></button>
    <button class="mbn-sheet-item" data-page="audit"><i class="fa-solid fa-shield-halved"></i><span>Audit Log</span></button>
    <button class="mbn-sheet-item" data-page="rating"><i class="fa-solid fa-star"></i><span>Rating</span></button>
    <button class="mbn-sheet-item" data-page="export"><i class="fa-solid fa-file-csv"></i><span>Export</span></button>
  </div>
</div>

<div class="modal-back" id="modal"><div class="modal" id="modalBox"></div></div>

<div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="ui.js"></script>
<script type="module" src="admin.js"></script>
<script src="fx.js" defer></script>
<!-- Vercel Web Analytics -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
